# DarkFleet — local-first maritime SAR/AIS correlation platform.
#
#   cp .env.example .env      # optional: add provider credentials
#   docker compose up --build
#
# API : http://localhost:8000   (OpenAPI docs at /docs)
# Web : http://localhost:8080
#
# Data persists in the darkfleet-data volume (AIS archive, scans, cache,
# boundaries). Deleting it discards history — the AIS archive cannot be
# rebuilt from scratch, so back it up once you have collected anything.
#
# Provider credentials are read from .env via env_file and are never baked
# into an image. With no credentials the providers report their real state
# (AUTH_REQUIRED / NOT_CONFIGURED); nothing is simulated in their place.

name: darkfleet

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: darkfleet/api:3.0.0
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DARKFLEET_DATA_DIR: /data
      DARKFLEET_API_HOST: 0.0.0.0
      DARKFLEET_API_PORT: "8000"
    volumes:
      - darkfleet-data:/data
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/api/providers/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    image: darkfleet/web:3.0.0
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "8080:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 4s
      retries: 3
    security_opt:
      - no-new-privileges:true

volumes:
  darkfleet-data:
    driver: local