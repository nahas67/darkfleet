# DarkFleet — local-first maritime SAR/AIS correlation platform.
#
#   cp .env.example .env      # optional: add provider credentials
#   docker compose up --build
#
# API : http://localhost:8000   (OpenAPI docs at /docs)
# Web : http://localhost:8080 (or $DARKFLEET_WEB_PORT when 8080 is taken)

# Every scan is a REAL scan against a live provider. This deployment has no
# synthetic code path to turn on: there is no such mode, so no flag exists and
# none is needed. A provider that cannot serve a request returns an error.
#
# Data persists in the darkfleet-data volume (AIS archive, scans, cache,
# boundaries). Deleting it discards history — the AIS archive cannot be
# rebuilt from scratch, so back it up once you have collected anything.
#
# Provider credentials are read from .env via env_file and are never baked
# into an image. With no credentials the providers report their real state
# (AUTH_REQUIRED / NOT_CONFIGURED); nothing is simulated in their place.

name: darkfleet

services:
  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    image: darkfleet/api:3.0.0
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      DARKFLEET_DATA_DIR: /data
      DARKFLEET_API_HOST: 0.0.0.0
      DARKFLEET_API_PORT: "8000"
      # Every scan in this deployment is a REAL scan. Stated explicitly rather
      # than left to the default so the intent survives an image rebuild. REAL is
      # the only accepted value, so a typo here fails the boot loudly instead of
      # selecting a different kind of scan.
      DARKFLEET_RUNTIME_MODE: REAL
    volumes:
      - darkfleet-data:/data
    ports:
      # Only publish to the host loopback by default. The API has no auth.
      - "127.0.0.1:8000:8000"
    healthcheck:
      # Liveness ONLY. This must not probe a provider: when it did, a slow third
      # party pushed the probe past its timeout and Docker restarted a healthy
      # API in a loop. Provider readiness is /api/providers/health, which the
      # UI reads but the orchestrator must not gate on.
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    security_opt:
      - no-new-privileges:true

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    image: darkfleet/web:3.0.0
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Overridable because 8080 is often taken (e.g. by another dev server).
      # Default is unchanged: set DARKFLEET_WEB_PORT only when you need to.
      - "127.0.0.1:${DARKFLEET_WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 4s
      retries: 3
    security_opt:
      - no-new-privileges:true

volumes:
  darkfleet-data:
    driver: local
