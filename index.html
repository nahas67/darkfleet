<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DarkFleet &mdash; Maritime SAR/AIS Intelligence</title>
    <!--
      The previous description claimed the platform was "for detecting covert dark
      fleet activity". That is the framing this product rejects: a radar return
      with no AIS association is a measurement about correlation, and the product
      makes no claim about intent. The copy below describes what it does.
    -->
    <meta
      name="description"
      content="Open-source maritime spatial-intelligence platform. Correlates Sentinel-1 SAR vessel detections with AIS observations to produce evidence, confidence and uncertainty. Every result is traceable to a real acquisition."
    />
    <meta property="og:title" content="DarkFleet &mdash; Maritime SAR/AIS Intelligence" />
    <meta
      property="og:description"
      content="Evidence-oriented SAR/AIS correlation over real Sentinel-1 acquisitions and timestamped AIS observations."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Cesium's own stylesheet is imported in src/main.tsx, where Vite can
         resolve and fingerprint it. Linking /cesium/Widgets/widgets.css here as
         well duplicated it and emitted a build-time warning. CESIUM_BASE_URL is
         still required: it is where the plugin serves Workers/Assets/ThirdParty. -->
    <script>window.CESIUM_BASE_URL = '/cesium';</script>
    <!-- Typography uses local/system stacks in src/design/tokens.css. No runtime font CDN. -->
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      DarkFleet renders an interactive 3D globe and requires JavaScript.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
