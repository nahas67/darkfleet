[project]
name = "darkfleet"
version = "3.0.0"
description = "DarkFleet: correlate what satellite radar sees with what AIS reports."
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.13"
authors = [{ name = "DarkFleet" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "numpy>=1.26",
    "rasterio>=1.3",
    "pyproj>=3.6",
    "shapely>=2.0",
    "pystac-client>=0.8",
    "duckdb>=1.1",
    "pyarrow>=17.0",
    "pytz>=2024.1",
    "httpx>=0.27",
    "websockets>=13.0",
    "opencv-python-headless>=5.0",
    "scikit-image>=0.26",
    "scipy>=1.18",
    "pyais>=3.0",
    "fpdf2>=2.7",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["darkfleet"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Reusing another module's pytest fixtures means importing the fixture function
# and then naming it as a test parameter. That IS the use -- pytest resolves a
# test's fixtures by parameter name, so the import and the parameter are the same
# identifier by design. Ruff models neither pytest nor fixtures and reports the
# parameter as a redefinition of an "unused" import.
#
# Scoped to the files that reuse fixtures rather than enabled repo-wide, so a
# genuine redefinition elsewhere still fails.
"tests/test_debug_table_rows.py" = ["F811"]
"tests/test_cfar_request_boundary.py" = ["F811"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# The default suite is fully offline. Tests that need the live provider are
# marked `live` and must be asked for explicitly:
#   pytest -m live
addopts = "-m 'not live'"
markers = [
    "live: needs network access to a real provider; run with -m live",
]
