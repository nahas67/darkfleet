<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DarkFleet AIS GPU Measurement Harness</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; background: #05070a; color: #eee; font: 13px monospace; }
      #map { position: fixed; inset: 0; }
      #report { position: fixed; left: 12px; top: 12px; z-index: 100; background: #071019e8; padding: 12px; width: min(600px, 60vw); max-height: 75vh; overflow: auto; white-space: pre-wrap; }
      #controls { position: fixed; right: 12px; top: 12px; z-index: 101; padding: 10px; background: #071019f0; display: flex; flex-direction: column; gap: 7px; max-width: 270px; }
      #controls button { background: #102b39; color: #e8f6ff; border: 1px solid #3f7b91; padding: 8px; cursor: pointer; }
      #controls button:disabled { opacity: 0.45; cursor: wait; }
      #controls small { color: #b3c1ce; line-height: 1.4; }
    </style>
  </head>
  <body>
    <div id="map"></div>
    <pre id="report">Initialising isolated Cesium renderer…</pre>
    <div id="controls">
      <strong>DF-X9.8 hardware evidence</strong>
      <button id="run-all" type="button">Run staged H7/H8 harness</button>
      <button id="run-10k" type="button">Run 10K contact stage</button>
      <button id="download-evidence" type="button">Download captured JSON</button>
      <small id="run-status" role="status">Ready after Cesium initializes. Keep this tab foregrounded during measurement.</small>
      <small>Fixtures only. RAF and Cesium frame intervals are wall-clock measures; heap samples are not GPU memory. Browser hardware identity must be inspected.</small>
    </div>
    <script type="module" src="/tools/ais-gpu/main.ts"></script>
  </body>
</html>
